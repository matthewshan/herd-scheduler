<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herd Scheduler — Screen Mockups</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="kit.css">
<style>
  body{background:var(--frame-canvas)}
  .gallery{max-width:1320px;margin:0 auto;padding:48px 32px 72px}
  .gallery-head{margin:0 0 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .gallery-head h1{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--fg1);margin:0;letter-spacing:-.01em}
  .gallery-head p{font-family:var(--font-body);font-size:15px;color:var(--fg2);margin:8px 0 0;max-width:620px}
  .gtheme{flex:0 0 auto;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--fg1);font-family:var(--font-body);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:var(--sh-1)}
  .gtheme:hover{background:var(--surface-2)}
  .flow-label{display:flex;align-items:center;gap:10px;margin:44px 0 20px}
  .flow-label .n{font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;background:var(--brand);width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .flow-label h2{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--fg1);margin:0}
  .flow-label .line{flex:1;height:1px;background:var(--border)}
  .frames{display:flex;flex-wrap:wrap;gap:30px 26px}
  .frame{display:flex;flex-direction:column;align-items:center;gap:14px}
  .frame .phone{transform:scale(.82);transform-origin:top center;margin-bottom:-130px}
  .cap{font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--fg1);text-align:center}
  .cap span{display:block;font-weight:400;color:var(--fg2);font-size:12px;margin-top:2px;max-width:230px}
  .mini-phone{width:390px}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Calendar.jsx"></script>
<script type="text/babel" src="VoteScreen.jsx"></script>
<script type="text/babel" src="ResultsScreen.jsx"></script>
<script type="text/babel" src="CreateScreen.jsx"></script>
<script type="text/babel" src="SecondaryScreens.jsx"></script>
<script type="text/babel">
const noop = () => {};
initTheme();

function GalleryThemeBtn() {
  const [dark, setDark] = React.useState(() => document.documentElement.dataset.theme === 'dark');
  return (
    <button className="gtheme" onClick={() => { const n = !dark; applyTheme(n ? 'dark' : 'light'); setDark(n); }}>
      <Icon name={dark ? 'sun' : 'moon'} size={17} />{dark ? 'Light mode' : 'Dark mode'}
    </button>
  );
}

function Frame({ title, sub, children }) {
  return (
    <div className="frame">
      <div className="mini-phone">{children}</div>
      <div className="cap">{title}{sub && <span>{sub}</span>}</div>
    </div>
  );
}

function Flow({ n, title, children }) {
  return (
    <>
      <div className="flow-label"><span className="n">{n}</span><h2>{title}</h2><span className="line" /></div>
      <div className="frames">{children}</div>
    </>
  );
}

const votesMix = { s1: 'no', s2: 'yes', s3: 'maybe' };
const votesFull = { s1: 'no', s2: 'yes', s3: 'maybe', s4: 'no' };

function Gallery() {
  return (
    <div className="gallery">
      <div className="gallery-head">
        <div>
          <h1>Herd Scheduler — screen mockups</h1>
          <p>The full host-and-voter flow across the three core screens plus sign-in, shown in their key states. Built from the design-system components; every screen is live in the interactive prototype.</p>
        </div>
        <GalleryThemeBtn />
      </div>

      <Flow n="1" title="Vote — the core screen">
        <Frame title="Empty" sub="Nothing selected, guest name needed">
          <Phone><VoteScreen go={noop} /></Phone>
        </Frame>
        <Frame title="In progress" sub="Mixed Yes / If-need-be / No, named voter">
          <Phone><VoteScreen go={noop} initialName="Priya" initialVotes={votesMix} /></Phone>
        </Frame>
        <Frame title="Submitted" sub="Saved confirmation, editable anytime">
          <Phone><VoteScreen go={noop} initialName="Priya" initialVotes={votesFull} initialSubmitted={true} /></Phone>
        </Frame>
      </Flow>

      <Flow n="2" title="Results — breakdown & finalize">
        <Frame title="Host view" sub="Best-fit ring, works-for-everyone, finalize buttons">
          <Phone><ResultsScreen go={noop} isHost={true} /></Phone>
        </Frame>
        <Frame title="Finalized" sub="Top banner + chosen card marked">
          <Phone><ResultsScreen go={noop} isHost={true} initialFinalized="s2" /></Phone>
        </Frame>
        <Frame title="Viewer (non-host)" sub="Same highlights, no finalize controls">
          <Phone><ResultsScreen go={noop} isHost={false} /></Phone>
        </Frame>
      </Flow>

      <Flow n="3" title="Create poll & share">
        <Frame title="Build the poll" sub="Title, timezone, repeatable time slots">
          <Phone><CreateScreen go={noop} /></Phone>
        </Frame>
        <Frame title="Share state" sub="Generated link + copy">
          <Phone><CreateScreen go={noop} initialCreated={true} /></Phone>
        </Frame>
        <Frame title="Sign in" sub="Minimal Google + guest path">
          <Phone><SignInScreen go={noop} /></Phone>
        </Frame>
      </Flow>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Gallery />);
</script>
</body>
</html>
