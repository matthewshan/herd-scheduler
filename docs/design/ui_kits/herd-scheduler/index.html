<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herd Scheduler — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Calendar.jsx"></script>
<script type="text/babel" src="VoteScreen.jsx"></script>
<script type="text/babel" src="ResultsScreen.jsx"></script>
<script type="text/babel" src="CreateScreen.jsx"></script>
<script type="text/babel" src="SecondaryScreens.jsx"></script>
<script type="text/babel">
const { useState } = React;
initTheme();

const SCREENS = [
  { key: 'vote',    label: 'Vote' },
  { key: 'results', label: 'Results' },
  { key: 'create',  label: 'Create' },
  { key: 'signin',  label: 'Sign in' },
  { key: 'admin',   label: 'Admin' },
];

function App() {
  const [screen, setScreen] = useState('vote');
  const [isHost, setIsHost] = useState(true);
  const go = (s) => setScreen(s);

  return (
    <div className="canvas">
      <Phone>
        {screen === 'vote'    && <VoteScreen go={go} />}
        {screen === 'results' && <ResultsScreen go={go} isHost={isHost} />}
        {screen === 'create'  && <CreateScreen go={go} />}
        {screen === 'signin'  && <SignInScreen go={go} />}
        {screen === 'admin'   && <AdminScreen go={go} />}
      </Phone>

      <div className="devnav">
        {SCREENS.map(s => (
          <button key={s.key} className={screen === s.key ? 'active' : ''} onClick={() => setScreen(s.key)}>{s.label}</button>
        ))}
        {screen === 'results' && (
          <button onClick={() => setIsHost(h => !h)} style={{ color: isHost ? 'var(--brand)' : 'var(--fg2)' }}>
            {isHost ? '◆ Host view' : '◇ Viewer'}
          </button>
        )}
        <ThemeToggle />
      </div>
      <div className="devnav-note">Prototype · tap the segmented controls and buttons — flows are wired · <a href="Mockups.html" style={{color:'var(--brand)',fontWeight:600}}>view all screens →</a></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
