<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="Card 12 · button/input 10 · pill 999" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:26px 28px;-webkit-font-smoothing:antialiased;display:flex;gap:28px;align-items:flex-end}
  .item{text-align:center}
  .box{width:84px;height:64px;background:var(--brand-tint);border:1.5px solid var(--brand)}
  .lbl{margin-top:10px;font-family:var(--font-body);font-size:12px;color:var(--fg1)}
  .lbl b{display:block;font-weight:600}
  .lbl span{color:var(--fg3);font-feature-settings:'tnum' 1}
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="lbl"><b>Card</b><span>12px</span></div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="lbl"><b>Button</b><span>10px</span></div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="lbl"><b>Input</b><span>10px</span></div></div>
  <div class="item"><div class="box" style="border-radius:999px;width:120px"></div><div class="lbl"><b>Pill / chip / thumb</b><span>999px</span></div></div>
  <div class="item"><div class="box" style="border-radius:999px;width:64px"></div><div class="lbl"><b>Avatar</b><span>circle</span></div></div>
</body>
</html>
