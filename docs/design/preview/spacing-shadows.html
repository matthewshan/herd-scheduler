<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:30px 28px;-webkit-font-smoothing:antialiased;display:flex;gap:26px;align-items:center;justify-content:space-between}
  .item{text-align:center}
  .box{width:96px;height:64px;background:#fff;border-radius:12px;margin:0 auto}
  .lbl{margin-top:14px;font-family:var(--font-body);font-size:12px;color:var(--fg1)}
  .lbl b{display:block;font-weight:600}
  .lbl span{color:var(--fg3)}
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--sh-1);border:1px solid var(--border)"></div><div class="lbl"><b>--sh-1</b><span>resting cards</span></div></div>
  <div class="item"><div class="box" style="box-shadow:var(--sh-2)"></div><div class="lbl"><b>--sh-2</b><span>sticky bar · popover</span></div></div>
  <div class="item"><div class="box" style="box-shadow:var(--sh-3)"></div><div class="lbl"><b>--sh-3</b><span>sheet · modal</span></div></div>
  <div class="item"><div class="box" style="background:#0077B6;box-shadow:var(--sh-brand)"></div><div class="lbl"><b>--sh-brand</b><span>primary CTA</span></div></div>
</body>
</html>
