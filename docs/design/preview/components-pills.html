<!DOCTYPE html>
<!-- @dsCard group="Components" name="Status pills & chips" subtitle="Best fit · works for everyone · finalized · timezone" viewport="700x110" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:26px 28px;-webkit-font-smoothing:antialiased;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:var(--r-pill);font-family:var(--font-body);font-weight:600;font-size:13px}
  .best{background:var(--brand);color:#fff}
  .all{background:var(--yes-tint);color:var(--yes)}
  .fin{background:var(--brand-tint);color:var(--brand);box-shadow:inset 0 0 0 1px rgba(0,119,182,.25)}
  .tz{background:var(--surface-2);color:var(--fg2);font-weight:500}
</style>
</head>
<body>
  <span class="pill best">★ Best fit</span>
  <span class="pill all">✓ Works for everyone</span>
  <span class="pill fin">Finalized ✓</span>
  <span class="pill tz">Times shown in Eastern Time · ET</span>
</body>
</html>
