<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:24px 28px;-webkit-font-smoothing:antialiased}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .col{}
  .pair{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border);height:56px}
  .solid{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px}
  .tint{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-weight:600;font-size:13px}
  .lbl{margin-top:8px;font-family:var(--font-body)}
  .lbl b{display:block;font-size:13px;color:var(--fg1)}
  .lbl span{font-size:12px;color:var(--fg3);font-feature-settings:'tnum' 1}
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <div class="pair"><div class="solid" style="background:#16A34A;color:#fff">Yes</div><div class="tint" style="background:#DCFCE7;color:#16A34A">Yes</div></div>
      <div class="lbl"><b>Yes / available</b><span>#16A34A · #DCFCE7</span></div>
    </div>
    <div class="col">
      <div class="pair"><div class="solid" style="background:#D97706;color:#fff">Maybe</div><div class="tint" style="background:#FEF3C7;color:#B45309">Maybe</div></div>
      <div class="lbl"><b>If-need-be</b><span>#D97706 · #FEF3C7</span></div>
    </div>
    <div class="col">
      <div class="pair"><div class="solid" style="background:#DC2626;color:#fff">No</div><div class="tint" style="background:#FEE2E2;color:#DC2626">No</div></div>
      <div class="lbl"><b>No / unavailable</b><span>#DC2626 · #FEE2E2</span></div>
    </div>
  </div>
</body>
</html>
