<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8px grid with 4px half-step" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:24px 28px;-webkit-font-smoothing:antialiased}
  .row{display:flex;align-items:center;gap:14px;padding:5px 0}
  .bar{height:16px;background:var(--brand);border-radius:3px}
  .tok{font-family:var(--font-body);font-size:13px;color:var(--fg1);width:48px}
  .px{font-family:var(--font-body);font-size:12px;color:var(--fg3);font-feature-settings:'tnum' 1}
</style>
</head>
<body>
  <div class="row"><span class="tok">--s-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="row"><span class="tok">--s-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="row"><span class="tok">--s-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="row"><span class="tok">--s-4</span><span class="bar" style="width:16px"></span><span class="px">16px · base gutter</span></div>
  <div class="row"><span class="tok">--s-5</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="row"><span class="tok">--s-6</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="row"><span class="tok">--s-7</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="row"><span class="tok">--s-8</span><span class="bar" style="width:64px"></span><span class="px">64px</span></div>
</body>
</html>
