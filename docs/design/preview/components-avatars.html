<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:26px 28px;-webkit-font-smoothing:antialiased;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .av{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;color:#fff}
  .stack{display:flex}
  .stack .av{width:36px;height:36px;font-size:13px;margin-left:-10px;box-shadow:0 0 0 2px #fff}
  .stack .av:first-child{margin-left:0}
  .more{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-weight:600;font-size:12px;color:var(--fg2);background:var(--surface-2);margin-left:-10px;box-shadow:0 0 0 2px #fff}
</style>
</head>
<body>
  <div class="av" style="background:#0077B6">A</div>
  <div class="av" style="background:#7C3AED">P</div>
  <div class="av" style="background:#0891B2">M</div>
  <div class="av" style="background:#DB2777">D</div>
  <div class="av" style="background:#059669">S</div>
  <div class="av" style="background:#D97706">J</div>
  <div class="stack" style="margin-left:8px">
    <div class="av" style="background:#0077B6">A</div>
    <div class="av" style="background:#7C3AED">P</div>
    <div class="av" style="background:#0891B2">M</div>
    <div class="more">+3</div>
  </div>
</body>
</html>
