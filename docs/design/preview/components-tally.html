<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:24px 28px;-webkit-font-smoothing:antialiased;display:flex;gap:40px;align-items:center}
  .block{flex:1}
  h3{font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px}
  .tally{display:flex;gap:8px}
  .t{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-body);font-weight:600;font-size:13px;font-feature-settings:'tnum' 1}
  .dot{width:9px;height:9px;border-radius:999px}
  .bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
  .seg-y{background:var(--yes)}.seg-m{background:var(--maybe)}.seg-n{background:var(--no)}
  .legend{margin-top:10px;font-family:var(--font-body);font-size:12px;color:var(--fg2);font-feature-settings:'tnum' 1}
</style>
</head>
<body>
  <div class="block">
    <h3>Tally pills</h3>
    <div class="tally">
      <span class="t" style="color:var(--yes)"><span class="dot" style="background:var(--yes)"></span>5 Yes</span>
      <span class="t" style="color:#B45309"><span class="dot" style="background:var(--maybe)"></span>1</span>
      <span class="t" style="color:var(--no)"><span class="dot" style="background:var(--no)"></span>0</span>
    </div>
  </div>
  <div class="block">
    <h3>Stacked bar</h3>
    <div class="bar"><span class="seg-y" style="width:83%"></span><span class="seg-m" style="width:17%"></span></div>
    <div class="legend">5 Yes · 1 if-need-be · 0 No</div>
  </div>
</body>
</html>
