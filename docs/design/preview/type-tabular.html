<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:22px 28px;-webkit-font-smoothing:antialiased}
  .wrap{display:flex;gap:40px;align-items:flex-start}
  .col h3{font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
  .times{font-family:var(--font-body);font-size:18px;color:var(--fg1);line-height:28px}
  .good{font-feature-settings:'tnum' 1,'lnum' 1}
  .note{margin-top:14px;font-family:var(--font-body);font-size:12px;color:var(--fg3)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <h3>Tabular ✓ (used)</h3>
      <div class="times good">7:00–10:00&nbsp;PM<br>6:00–9:00&nbsp;PM<br>11:00–11:00&nbsp;PM<br>5:00–8:00&nbsp;PM</div>
    </div>
    <div class="col">
      <h3>Proportional ✗</h3>
      <div class="times">7:00–10:00&nbsp;PM<br>6:00–9:00&nbsp;PM<br>11:00–11:00&nbsp;PM<br>5:00–8:00&nbsp;PM</div>
    </div>
  </div>
  <div class="note">All clock times use Inter tabular figures so digits sit in fixed-width columns and don't jitter.</div>
</body>
</html>
