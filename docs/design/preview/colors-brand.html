<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:24px 28px;-webkit-font-smoothing:antialiased}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .sw{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .chip{height:64px}
  .meta{padding:8px 10px;font-family:var(--font-body)}
  .name{font-size:13px;font-weight:600;color:var(--fg1)}
  .hex{font-size:12px;color:var(--fg3);font-feature-settings:'tnum' 1}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#0077B6"></div><div class="meta"><div class="name">Brand / cerulean</div><div class="hex">#0077B6</div></div></div>
    <div class="sw"><div class="chip" style="background:#005E9E"></div><div class="meta"><div class="name">Brand hover</div><div class="hex">#005E9E</div></div></div>
    <div class="sw"><div class="chip" style="background:#E5F1F8"></div><div class="meta"><div class="name">Brand tint</div><div class="hex">#E5F1F8</div></div></div>
    <div class="sw"><div class="chip" style="background:#14181F"></div><div class="meta"><div class="name">Text primary</div><div class="hex">#14181F</div></div></div>
    <div class="sw"><div class="chip" style="background:#5B6472"></div><div class="meta"><div class="name">Text secondary</div><div class="hex">#5B6472</div></div></div>
    <div class="sw"><div class="chip" style="background:#F7F8FA;box-shadow:inset 0 0 0 1px #E6E8EC"></div><div class="meta"><div class="name">Canvas</div><div class="hex">#F7F8FA</div></div></div>
  </div>
</body>
</html>
