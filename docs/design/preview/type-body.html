<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:24px 28px;-webkit-font-smoothing:antialiased}
  .row{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:0}
  .spec{margin-left:auto;font-family:var(--font-body);font-size:12px;color:var(--fg3);white-space:nowrap}
</style>
</head>
<body>
  <div class="row">
    <span class="ds-body">Bringing snacks, just need a night that works.</span>
    <span class="spec">Inter · 400 · 16/24</span>
  </div>
  <div class="row">
    <span class="ds-label">Your name</span>
    <span class="spec">Inter · 500 · 15/20</span>
  </div>
  <div class="row">
    <span class="ds-meta">Times shown in Eastern Time · ET</span>
    <span class="spec">Inter · 500 · 13/18</span>
  </div>
  <div class="row">
    <span class="ds-micro">Best fit</span>
    <span class="spec">Inter · 600 · 11/14 · +4% · UPPER</span>
  </div>
</body>
</html>
