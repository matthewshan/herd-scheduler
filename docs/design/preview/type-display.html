<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:24px 28px;-webkit-font-smoothing:antialiased}
  .row{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:0}
  .spec{margin-left:auto;font-family:var(--font-body);font-size:12px;color:var(--fg3);white-space:nowrap}
</style>
</head>
<body>
  <div class="row">
    <span class="ds-display">Game Night</span>
    <span class="spec">Space Grotesk · 700 · 28/34 · -1%</span>
  </div>
  <div class="row">
    <span class="ds-h1">When works for everyone?</span>
    <span class="spec">Space Grotesk · 700 · 22/28</span>
  </div>
  <div class="row">
    <span class="ds-h2">Sat, Jun 7</span>
    <span class="spec">Space Grotesk · 500 · 18/24</span>
  </div>
</body>
</html>
