<!DOCTYPE html>
<!-- @dsCard group="Components" name="Input fields" subtitle="Default, focus, error states" viewport="700x265" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--surface);padding:24px 28px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;gap:16px}
  label{display:block;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--fg2);margin-bottom:6px}
  .field{width:100%;box-sizing:border-box;height:46px;border-radius:var(--r-input);border:1px solid var(--border-strong);background:#fff;padding:0 14px;font-family:var(--font-body);font-size:15px;color:var(--fg1)}
  .field.ph{color:var(--fg3)}
  .field.focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,119,182,.18)}
  .field.err{border-color:var(--no);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
  .errmsg{margin-top:6px;font-family:var(--font-body);font-size:12px;color:var(--no)}
  .two{display:flex;gap:12px}.two>div{flex:1}
</style>
</head>
<body>
  <div><label>Your name</label><div class="field focus">Priya</div></div>
  <div><label>Your name</label><div class="field err ph">Enter your name to vote</div><div class="errmsg">Add your name so friends know who voted.</div></div>
  <div><label>Poll title</label><div class="field ph">e.g. Game Night</div></div>
</body>
</html>
