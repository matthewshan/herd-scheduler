# Publish the image to GitHub Container Registry when a GitHub *release* is
# published (Phase 12). Complements publish-image.yml (which fires on main pushes
# and `v*.*.*` tag pushes) — this one keys on the release event and tags the
# image from the release's git tag (e.g. release on tag v1.2.0 → :1.2.0).
#
# Tags published per release:
#   release (tag vX.Y.Z) → ghcr.io/<owner>/herd-scheduler:X.Y.Z (+ :latest)
# and the migration one-shot as the same tags with a `-migrate` suffix, built
# from the `migrate` target.

name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/herd-scheduler

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The release's git tag drives the image tag; `match`/strip the leading
          # `v` so v1.2.0 → :1.2.0 (matching the semver style of publish-image).
          # `latest=true` is safe — `release: published` only fires for the
          # newest published release.
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=match,pattern=v?(.*),group=1,value=${{ github.event.release.tag_name }}
          flavor: |
            latest=true

      - name: Migrate image metadata
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=match,pattern=v?(.*),group=1,value=${{ github.event.release.tag_name }}
          flavor: |
            latest=true
            suffix=-migrate

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
