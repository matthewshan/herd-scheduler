# Publish the versioned images to GitHub Container Registry when a GitHub
# *release* is published (Phase 12). This workflow owns every versioned tag;
# publish-image.yml only handles merges to main (`:latest` + `:sha-…`). Pushing
# a bare `v*.*.*` git tag without a release no longer publishes anything — a
# release is the one trigger, so a release that creates its tag can't race a
# second tag-push build for the same image tags.
#
# Tags published per release (release on git tag vX.Y.Z):
#   ghcr.io/<owner>/herd-scheduler:X.Y.Z       (leading `v` stripped, semver)
#   ghcr.io/<owner>/herd-scheduler:latest      ONLY when this release is the
#                                              repo's "Latest" release (below)
# and the migration one-shot as the same tags with a `-migrate` suffix, built
# from the `migrate` target.
#
# When does `:latest` move? `release: published` fires for EVERY published
# release — prereleases and backports (e.g. v1.1.5 cut after v1.2.0) included —
# so it can't be assumed to be the newest. We move `:latest` only when the tag
# is what GitHub's `GET /releases/latest` returns: that endpoint never returns
# a prerelease or draft and reflects the repo's "Latest" badge (semver/date
# based, or the owner's explicit "Set as the latest release" choice). Prereleases
# and older-version backports therefore publish only their `:X.Y.Z` tags.
# Note: merges to main (publish-image.yml) also move `:latest`.
#
# Manual runs (workflow_dispatch) rebuild the images for an existing published
# release — pass its git tag (e.g. v1.2.0). The same `:latest` rule applies.

name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag of an existing published release to (re)publish, e.g. v1.2.0
        required: true
        type: string

concurrency:
  group: release-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/herd-scheduler

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Resolve which release we're publishing and whether it may move
      # `:latest`. Event/input values reach the script only through env vars —
      # never interpolated into the script body.
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$tag' is not a semver tag (vX.Y.Z)."
            exit 1
          fi

          # Fails (and stops the job) if no release exists for this tag — a
          # manual run must name a real release.
          info=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')
          read -r is_prerelease is_draft <<< "$info"
          if [[ "$is_draft" == "true" ]]; then
            echo "::error::Release $tag is still a draft; publish it first."
            exit 1
          fi

          # 404 when the repo has no non-prerelease release yet → not latest.
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq .tag_name 2>/dev/null || true)

          latest=false
          if [[ "$is_prerelease" == "false" && "$tag" == "$latest_tag" ]]; then
            latest=true
          fi
          echo "Release $tag: prerelease=$is_prerelease, repo latest=${latest_tag:-<none>} → move :latest=$latest"

          {
            echo "tag=$tag"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      # Build from the release's tag, not the dispatching branch.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `{{version}}` strips the leading `v` (v1.2.0 → :1.2.0), matching the
          # semver style documented in docs/deployment.md.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
          flavor: |
            latest=${{ steps.release.outputs.latest }}

      - name: Migrate image metadata
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
          flavor: |
            latest=${{ steps.release.outputs.latest }}
            suffix=-migrate

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          # mode=min (not max): the `builder` stage is invalidated by `COPY . .`
          # on every commit, so exporting its (large) layers each run is ~2 min of
          # wasted upload for a near-zero hit rate. The reusable `deps` layer is
          # kept cached by the migrate build's mode=max below.
          cache-to: type=gha,mode=min

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          # mode=max here is cheap — the migrate target only references the `deps`
          # stage (no `builder`/.next output), so this exports the install layer
          # both images reuse, keeping `pnpm install` cached across runs.
          cache-to: type=gha,mode=max
