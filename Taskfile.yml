# go-task tasks for herd-scheduler (optional convenience wrappers).
# Install: https://taskfile.dev/installation/ · run `task` to list them.
version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  db:
    desc: "Start the local dev Postgres (foreground; Ctrl+C to stop)"
    cmds:
      - docker compose up

  db:down:
    desc: "Stop and remove the dev Postgres container (keeps the data volume)"
    cmds:
      - docker compose down

  db:reset:
    desc: "Tear down the dev Postgres AND drop its data volume"
    cmds:
      - docker compose down -v

  dev:
    desc: "Run the Next.js dev server (needs `task db` running)"
    cmds:
      - pnpm dev

  migrate:
    desc: "Create + apply a dev migration against DATABASE_URL"
    cmds:
      - pnpm migrate:dev
