# Local dev database only. `docker compose up` starts Postgres on the default
# port 5432 in the foreground — Ctrl+C stops it, so nothing is left running in
# the background. Data persists in the `pgdata` volume across restarts.
#
# The app itself runs on the host (`pnpm dev`). Production portability is proven
# by the Dockerfile (`docker build`), not this file — see the tech spec §4.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
